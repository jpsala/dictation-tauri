version: 14
policy: traycer_native_intent_first

runtime:
  control_plane: traycer
  harness: codex
  fallback_harness: omp
  fallback_mode: manual_only
  daily_entry: conversation
  package_extension: none
  prompts: none
  local_runtime_copy: forbidden

execution:
  automatic_fallback: false
  automatic_new_session: false
  automatic_send: false

coordination:
  agents: explicit_user_request_only
  handoff: demand_only
  worktrees: isolated_for_concurrency_only

workflow:
  understand:
    strategy: current_session
    outcome: decision_or_explicit_blocker
  plan:
    strategy: current_session
    executes: false
    default: lightweight_implementation_brief
    content:
      - objective
      - observable_behavior
      - explicit_limits
      - focused_done_criteria
  implementation:
    strategy: current_session_direct
    tools: native_harness
    preserves_existing_work: true
    scope_growth: stop
  progress:
    mechanism: native_todos_when_useful
  persistence:
    strategy: concise_canonical_update
    duplicate_receipts: false

delegation:
  enabled: explicit_user_request_only
  implicit_handoff: forbidden
  linked_session: none
  fallback: none

approval:
  mode: single_batch_envelope
  local_reversible: proceed
  require_for:
    - accounts
    - installs
    - commit
    - push
    - deploy
    - production
    - external_side_effects

support_tools:
  orientation:
    - search
    - read
  changes:
    - edit
    - write
  diagnostics:
    - lsp
  judgment:
    - reviewer
  external_knowledge:
    - librarian
    - web
  human_decision:
    - ask_user
  visible_ui:
    - browser
    - computer

local_gates:
  - physical_audio
  - hotkeys
  - selection
  - desktop_delivery
  - accounts
  - installs
  - commit
  - push
  - deploy
  - production

removed_engines:
  taskflow: removed
  planner: removed
  relay: removed
  until_done: removed
  dgoal: removed
  governed_runner: removed
  worktree_bridge: removed

invariants:
  - user_intent_is_the_entrypoint
  - plans_do_not_execute_or_authorize_side_effects
  - no_project_runtime_state
  - no_selector_or_phase_command
  - no_new_session_or_automatic_handoff
  - no_automatic_send
  - no_global_package_dependency
  - local_reversible_work_uses_a_lightweight_brief
  - implementation_targets_the_observable_result_in_one_pass
  - material_scope_growth_stops_instead_of_absorbing_adjacent_work
  - project_desktop_gates_are_preserved

local_adapters:
  doctor: product_doctor_extension
  speckit: docs_skills
  impeccable: docs_skills_impeccable
